[versions]
kotlin = "2.3.20"
kotlinx-serialization = "1.11.0"
kotlinx-html = "0.12.0"
kotlinx-coroutines = "1.10.2"
shadow = "8.3.10"
korlibs-time = "5.4.0"
logback = "1.5.21"
ktor = "3.3.3"
koin = "4.1.1"
google-cloud-datastore = "2.35.0"
kotest = "6.0.4"
kotlin-react = "2026.5.1-19.2.6"
kotlin-tanstack-react-router = "2026.5.1-1.169.1"
kotlin-css = "2026.5.1"
kotlin-js = "2026.5.1"
kotlin-emotion-react = "2026.5.1-11.14.0"
krypto = "4.0.10"
kotlinx-cli = "0.3.6"

[libraries]
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-html = { group = "org.jetbrains.kotlinx", name = "kotlinx-html-jvm", version.ref = "kotlinx-html" }
