kotlin-tanstack-react-router = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-tanstack-react-router", version.ref = "kotlin-tanstack-react-router" }
kotlin-css = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-css", version.ref = "kotlin-css" }
kotlin-js = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-js", version.ref = "kotlin-js" }
kotlin-emotion-react = { group = "org.jetbrains.kotlin-wrappers", name = "kotlin-emotion-react", version.ref = "kotlin-emotion-react" }
krypto = { group = "com.soywiz.korlibs.krypto", name = "krypto", version.ref = "krypto" }
kotlinx-cli = { group = "org.jetbrains.kotlinx", name = "kotlinx-cli", version.ref = "kotlinx-cli" }
